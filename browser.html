<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SynapsePro - Browser</title>

    <link rel="icon" type="image/png" href="logo.png">

    <style>
        /* ── Design Tokens ─────────────────────────────────────── */
        :root {
            --bg:              #ffffff;
            --card-bg:         #F5F5F7;
            --card-hover:      #EAEAEC;
            --sep:             rgba(0, 0, 0, 0.08);
            --text-primary:    #1d1d1f;
            --text-secondary:  #6e6e73;
            --accent:          #0071D3;
            --tip-bg:          rgba(0, 113, 211, 0.06);
            --tip-border:      rgba(0, 113, 211, 0.18);
            --top-border:      rgba(0, 0, 0, 0.08);
            --chevron:         #C7C7CC;
            --search-bg:       #F5F5F7;
            --search-border:   rgba(0, 0, 0, 0.10);
            --search-focus:    rgba(0, 113, 211, 0.35);
            --search-icon:     #8E8E93;
        }

        /* ── Reset ─────────────────────────────────────────────── */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Base ──────────────────────────────────────────────── */
        body.browser-body {
            background-color: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
                         "Segoe UI", Helvetica, Arial, sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
        }

        /* ── Fixed hairline border ─────────────────────────────── */
        .fixed-top-border {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 1px;
            background: var(--top-border);
            z-index: 9999;
        }

        /* ── Layout ────────────────────────────────────────────── */
        .container {
            max-width: 520px;
            margin: 0 auto;
            padding: 0 20px 56px;
        }

        /* ── Search bar box ────────────────────────────────────── */
        .search-box {
            margin-top: 20px;
            margin-bottom: 38px;
        }

        .search-bar {
            display: flex;
            align-items: center;
            background: var(--search-bg);
            border: 1.5px solid var(--search-border);
            border-radius: 14px;
            padding: 0 14px;
            height: 46px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-bar:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--search-focus);
        }

        .search-bar svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            color: var(--search-icon);
            margin-right: 10px;
        }

        .search-bar input {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-family: inherit;
            font-size: 15px;
            color: var(--text-primary);
            line-height: 1;
        }

        .search-bar input::placeholder {
            color: var(--search-icon);
        }

        .search-bar .search-go-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            border: none;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
            flex-shrink: 0;
            margin-left: 8px;
            transition: opacity 0.15s ease, transform 0.1s ease;
            opacity: 0.35;
            pointer-events: none;
        }

        .search-bar .search-go-btn.active {
            opacity: 1;
            pointer-events: auto;
        }

        .search-bar .search-go-btn:hover {
            opacity: 0.85;
        }

        .search-bar .search-go-btn:active {
            transform: scale(0.92);
        }

        .search-bar .search-go-btn svg {
            width: 14px;
            height: 14px;
            color: #fff;
            margin: 0;
        }

        /* ── Tip callout ───────────────────────────────────────── */
        .tutorial-card {
            display: flex;
            gap: 11px;
            align-items: flex-start;
            background: var(--tip-bg);
            border: 1px solid var(--tip-border);
            border-radius: 14px;
            padding: 13px 16px;
            margin-bottom: 20px;
        }

        .tip-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            margin-top: 1px;
            color: var(--accent);
        }

        .tip-content h3 {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.2px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 3px;
        }

        .tip-content p {
            font-size: 13px;
            color: var(--text-primary);
            line-height: 1.55;
        }

        .tip-content strong {
            font-weight: 600;
        }

        /* ── Grouped list (iOS Settings style) ─────────────────── */
        .browser-list {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
        }

        .browser-card {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            text-decoration: none;
            color: var(--text-primary);
            position: relative;
            cursor: pointer;
            transition: background 0.12s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .browser-card + .browser-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 54px;
            right: 0;
            height: 0.5px;
            background: var(--sep);
        }

        .browser-card:hover  { background: var(--card-hover); }
        .browser-card:active { background: var(--card-hover); opacity: 0.6; }

        .browser-icon-wrapper {
            width: 30px;
            height: 30px;
            border-radius: 7px;
            overflow: hidden;
            flex-shrink: 0;
            margin-right: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
        }

        .browser-icon-wrapper img {
            width: 30px;
            height: 30px;
            object-fit: contain;
            display: block;
        }

        .browser-name {
            font-size: 16px;
            font-weight: 400;
            flex: 1;
            line-height: 1;
        }

        .browser-chevron {
            font-size: 19px;
            font-weight: 300;
            line-height: 1;
            color: var(--chevron);
            margin-left: 4px;
            letter-spacing: -1px;
        }

        /* ── Wide screens: grouped list → tile grid ────────────── */
        /* Below 640px everything stays exactly as before (single    */
        /* column, iOS grouped list). From 640px up the column       */
        /* widens and the list becomes a responsive card grid.       */
        @media (min-width: 640px) {
            .container {
                max-width: 900px;
                padding: 0 32px 64px;
            }

            .search-box {
                margin-top: 28px;
                margin-bottom: 30px;
            }

            .search-bar { height: 50px; }
            .search-bar input { font-size: 16px; }

            .tutorial-card { margin-bottom: 26px; }

            /* List becomes a grid of self-contained tiles */
            .browser-list {
                background: transparent;
                border-radius: 0;
                overflow: visible;
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
                gap: 12px;
            }

            .browser-card {
                background: var(--card-bg);
                border: 1px solid var(--sep);
                border-radius: 14px;
                padding: 16px 16px;
                transition: background 0.12s ease, transform 0.08s ease;
            }

            .browser-card:hover  { background: var(--card-hover); }
            .browser-card:active { transform: scale(0.985); opacity: 1; }

            /* Hairline separators only make sense in a single column */
            .browser-card + .browser-card::before { display: none; }
        }

        @media (min-width: 900px) {
            .browser-list {
                grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            }
        }

        /* ── Dark mode – system ────────────────────────────────── */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg:             #1c1c1e;
                --card-bg:        #2c2c2e;
                --card-hover:     #3a3a3c;
                --sep:            rgba(255, 255, 255, 0.09);
                --text-primary:   #f5f5f7;
                --text-secondary: #98989d;
                --accent:         #409CFF;
                --tip-bg:         rgba(64, 156, 255, 0.09);
                --tip-border:     rgba(64, 156, 255, 0.22);
                --top-border:     rgba(255, 255, 255, 0.08);
                --chevron:        #48484a;
                --search-bg:      #2c2c2e;
                --search-border:  rgba(255, 255, 255, 0.12);
                --search-focus:   rgba(64, 156, 255, 0.25);
                --search-icon:    #636366;
            }
        }

        /* ── Dark mode – Anki nightMode classes ────────────────── */
        body.nightMode, body.night_mode,
        html.nightMode body, html.night_mode body {
            --bg:             #1c1c1e;
            --card-bg:        #2c2c2e;
            --card-hover:     #3a3a3c;
            --sep:            rgba(255, 255, 255, 0.09);
            --text-primary:   #f5f5f7;
            --text-secondary: #98989d;
            --accent:         #409CFF;
            --tip-bg:         rgba(64, 156, 255, 0.09);
            --tip-border:     rgba(64, 156, 255, 0.22);
            --top-border:     rgba(255, 255, 255, 0.08);
            --chevron:        #48484a;
            --search-bg:      #2c2c2e;
            --search-border:  rgba(255, 255, 255, 0.12);
            --search-focus:   rgba(64, 156, 255, 0.25);
            --search-icon:    #636366;
        }
    </style>
</head>
<body class="browser-body">

    <div class="fixed-top-border"></div>

    <main>
        <section class="browser-section">
            <div class="container">

                <!-- Search bar -->
                <div class="search-box">
                    <div class="search-bar" id="searchBar">
                        <svg viewBox="0 0 20 20" fill="none"
                             stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="8.5" cy="8.5" r="6"/>
                            <line x1="13" y1="13" x2="18" y2="18"/>
                        </svg>
                        <input type="text" id="searchInput"
                               placeholder="Search with Google…"
                               autocomplete="off" spellcheck="false">
                        <button class="search-go-btn" id="searchBtn" tabindex="-1">
                            <svg viewBox="0 0 20 20" fill="none"
                                 stroke="currentColor" stroke-width="2.4"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <line x1="4" y1="10" x2="16" y2="10"/>
                                <polyline points="11,5 16,10 11,15"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Quick Search tip -->
                <div class="tutorial-card">
                    <svg class="tip-icon" viewBox="0 0 20 20" fill="none"
                         stroke="currentColor" stroke-width="1.7"
                         stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="10" cy="10" r="8.5"/>
                        <line x1="10" y1="9" x2="10" y2="14.5"/>
                        <circle cx="10" cy="6.2" r="0.7" fill="currentColor" stroke="none"/>
                    </svg>
                    <div class="tip-content">
                        <h3>Quick Search</h3>
                        <p>Highlight any text within your Anki cards, right-click, and select
                           <strong>"Search in Sidebar…"</strong> —
                           the selected term will be searched here automatically.</p>
                    </div>
                </div>

                <!-- Grouped browser list -->
                <div class="browser-list">

                    <a href="https://www.google.com" class="browser-card">
                        <div class="browser-icon-wrapper">
                            <img src="icons/google.png" alt="Google">
                        </div>
                        <span class="browser-name">Google</span>
                        <span class="browser-chevron">›</span>
                    </a>

                    <a href="https://www.bing.com" class="browser-card">
                        <div class="browser-icon-wrapper">
                            <img src="icons/bing.png" alt="Bing">
                        </div>
                        <span class="browser-name">Bing</span>
                        <span class="browser-chevron">›</span>
                    </a>

                    <a href="https://duckduckgo.com" class="browser-card">
                        <div class="browser-icon-wrapper">
                            <img src="icons/duckduckgo.png" alt="DuckDuckGo">
                        </div>
                        <span class="browser-name">DuckDuckGo</span>
                        <span class="browser-chevron">›</span>
                    </a>

                    <a href="https://www.baidu.com" class="browser-card">
                        <div class="browser-icon-wrapper">
                            <img src="icons/baidu.png" alt="Baidu">
                        </div>
                        <span class="browser-name">Baidu</span>
                        <span class="browser-chevron">›</span>
                    </a>

                    <a href="https://yandex.com" class="browser-card">
                        <div class="browser-icon-wrapper">
                            <img src="icons/yandex.png" alt="Yandex">
                        </div>
                        <span class="browser-name">Yandex</span>
                        <span class="browser-chevron">›</span>
                    </a>

                    <a href="https://www.ecosia.org" class="browser-card">
                        <div class="browser-icon-wrapper">
                            <img src="icons/ecosia.png" alt="Ecosia">
                        </div>
                        <span class="browser-name">Ecosia</span>
                        <span class="browser-chevron">›</span>
                    </a>

                    <a href="https://www.qwant.com" class="browser-card">
                        <div class="browser-icon-wrapper">
                            <img src="icons/qwant.png" alt="Qwant">
                        </div>
                        <span class="browser-name">Qwant</span>
                        <span class="browser-chevron">›</span>
                    </a>

                    <a href="https://www.youtube.com" class="browser-card">
                        <div class="browser-icon-wrapper">
                            <img src="icons/youtube.png" alt="YouTube">
                        </div>
                        <span class="browser-name">YouTube</span>
                        <span class="browser-chevron">›</span>
                    </a>

                    <a href="https://www.wikipedia.org" class="browser-card">
                        <div class="browser-icon-wrapper">
                            <img src="icons/wikipedia.png" alt="Wikipedia">
                        </div>
                        <span class="browser-name">Wikipedia</span>
                        <span class="browser-chevron">›</span>
                    </a>

                </div>

            </div>
        </section>
    </main>

    <script src="script.js"></script>
    <script>
        if (document.documentElement.classList.contains("nightMode") ||
            document.documentElement.classList.contains("night_mode")) {
            document.body.classList.add("nightMode");
        }

        // Search bar logic
        const searchInput = document.getElementById('searchInput');
        const searchBtn   = document.getElementById('searchBtn');

        searchInput.addEventListener('input', function () {
            searchBtn.classList.toggle('active', this.value.trim().length > 0);
        });

        // Treat the input as a direct URL when it looks like one,
        // otherwise fall back to a Google search.
        function looksLikeUrl(s) {
            if (/\s/.test(s)) return false;                 // has spaces → search
            if (/^https?:\/\//i.test(s)) return true;       // explicit scheme
            if (/^localhost(:\d+)?(\/|$)/i.test(s)) return true;
            return /^([a-z0-9-]+\.)+[a-z]{2,}(\/\S*)?$/i.test(s); // domain.tld
        }

        function performSearch() {
            const q = searchInput.value.trim();
            if (!q) return;
            if (looksLikeUrl(q)) {
                window.location.href = /^https?:\/\//i.test(q) ? q : 'https://' + q;
            } else {
                window.location.href =
                    'https://www.google.com/search?q=' + encodeURIComponent(q);
            }
        }

        searchInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') performSearch();
        });

        searchBtn.addEventListener('click', performSearch);

        // Browser-style shortcuts: "/" focuses the bar, Esc clears/blurs.
        document.addEventListener('keydown', function (e) {
            if (e.key === '/' && document.activeElement !== searchInput) {
                e.preventDefault();
                searchInput.focus();
            } else if (e.key === 'Escape' && document.activeElement === searchInput) {
                searchInput.value = '';
                searchBtn.classList.remove('active');
                searchInput.blur();
            }
        });
    </script>
</body>
</html>
