<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SynapsePro - Browser</title>
    
    <link rel="icon" type="image/png" href="logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body class="browser-body">

    <!-- Header: Logo ist nicht anklickbar -->
    <header class="main-header browser-header">
        <div class="container">
            <nav class="main-nav" style="justify-content: center;">
                <span class="logo" style="height: 60px; pointer-events: none;">
                    <img src="logo.png" alt="SynapsePro Logo">
                </span>
            </nav>
        </div>
    </header>

    <main>
        <section class="browser-section">
            <div class="container">
                <div class="section-header text-center">
                    <!-- Titel in Wunschfarbe -->
                    <h2 class="animate-on-scroll" style="color: rgb(11, 90, 201);">Welcome to your Browser.</h2>
                    <p class="animate-on-scroll">Select your preferred search engine to start browsing the web directly within Anki.</p>
                </div>

                <div class="browser-list animate-on-scroll">
                    
                    <!-- Google -->
                    <a href="https://www.google.com" class="browser-card">
                        <div class="browser-icon-wrapper">
                            <img src="icons/google.png" alt="Google">
                        </div>
                        <span class="browser-name">Google</span>
                    </a>

                    <!-- Bing -->
                    <a href="https://www.bing.com" class="browser-card">
                        <div class="browser-icon-wrapper">
                            <img src="icons/bing.png" alt="Bing">
                        </div>
                        <span class="browser-name">Bing</span>
                    </a>

                    <!-- DuckDuckGo -->
                    <a href="https://duckduckgo.com" class="browser-card">
                        <div class="browser-icon-wrapper">
                            <img src="icons/duckduckgo.png" alt="DuckDuckGo">
                        </div>
                        <span class="browser-name">DuckDuckGo</span>
                    </a>

                    <!-- YouTube -->
                    <a href="https://www.youtube.com" class="browser-card">
                        <div class="browser-icon-wrapper">
                            <img src="icons/youtube.png" alt="YouTube">
                        </div>
                        <span class="browser-name">YouTube</span>
                    </a>

                    <!-- Wikipedia -->
                    <a href="https://www.wikipedia.org" class="browser-card">
                        <div class="browser-icon-wrapper">
                            <img src="icons/wikipedia.png" alt="Wikipedia">
                        </div>
                        <span class="browser-name">Wikipedia</span>
                    </a>

                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>

</body>
</html>
