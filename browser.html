<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SynapsePro - Browser Tool</title>
    
    <link rel="icon" type="image/png" href="logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header: Logo ist jetzt größer (height: 60px) -->
    <header class="main-header">
        <div class="container">
            <nav class="main-nav" style="justify-content: center; height: 100px;">
                <a href="index.html" class="logo" style="height: 60px;">
                    <img src="logo.png" alt="SynapsePro Logo">
                </a>
            </nav>
        </div>
    </header>

    <main>
        <!-- ======== BROWSER SELECTION SECTION ======== -->
        <section class="browser-section">
            <div class="container text-center">
                <div class="section-header">
                    <h2 class="animate-on-scroll">Welcome to your Browser.</h2>
                    <p class="animate-on-scroll">Select your preferred search engine to start browsing the web directly within Anki.</p>
                </div>

                <!-- Hier ist jetzt das Grid statt der Liste -->
                <div class="browser-grid animate-on-scroll">
                    
                    <!-- Google -->
                    <a href="https://www.google.com" class="browser-card">
                        <div class="browser-icon">
                            <img src="icons/google.png" alt="Google">
                        </div>
                        <h3>Google</h3>
                    </a>

                    <!-- Bing -->
                    <a href="https://www.bing.com" class="browser-card">
                        <div class="browser-icon">
                            <img src="icons/bing.png" alt="Bing">
                        </div>
                        <h3>Bing</h3>
                    </a>

                    <!-- DuckDuckGo -->
                    <a href="https://duckduckgo.com" class="browser-card">
                        <div class="browser-icon">
                            <img src="icons/duckduckgo.png" alt="DuckDuckGo">
                        </div>
                        <h3>DuckDuckGo</h3>
                    </a>

                    <!-- YouTube -->
                    <a href="https://www.youtube.com" class="browser-card">
                        <div class="browser-icon">
                            <img src="icons/youtube.png" alt="YouTube">
                        </div>
                        <h3>YouTube</h3>
                    </a>

                    <!-- Wikipedia -->
                    <a href="https://www.wikipedia.org" class="browser-card">
                        <div class="browser-icon">
                            <img src="icons/wikipedia.png" alt="Wikipedia">
                        </div>
                        <h3>Wikipedia</h3>
                    </a>

                </div>
            </div>
        </section>
    </main>

    <footer class="main-footer">
        <div class="container">
            <p>&copy; 2024 SynapsePro. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>

</body>
</html>
